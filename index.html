:root{
  --ink:#0b0b0f;
  --ink-soft:#4b4f63;
  --paper:#eef2ff;
  --card:rgba(255,255,255,.62);
  --field:rgba(255,255,255,.78);
  --line:rgba(11,11,15,.12);
  --accent:#5b6cff;
  --accent-ink:#ffffff;
  --accent-soft:rgba(91,108,255,.14);
  --lilac:#c9b8ff;
  --mint:#b6ecd4;
  --sun:#ffd666;
  --error:#c4281c;
  --radius:24px;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 24px 60px -24px rgba(40,50,140,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"General Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

.shell{position:relative;z-index:1;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 18px}
.logo{font-family:"General Sans",system-ui,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo{color:var(--ink);text-decoration:none}.brand{display:block;width:auto;height:26px}
.tag{font-size:13px;font-weight:600;background:var(--ink);color:#fff;padding:6px 12px;border-radius:999px;white-space:nowrap}

.progress{height:6px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden;margin:0 2px 18px;opacity:0;transition:opacity .3s}
.progress.on{opacity:1}
.progress i{display:block;height:100%;width:0;background:var(--ink);border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

main{flex:1;display:flex;flex-direction:column}
.card{background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:28px 22px 22px;animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@media (min-width:600px){.card{padding:40px 40px 32px}}
.card.out{animation:out .2s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.card,.card.out{animation:none}.progress i{transition:none}}

.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0 0 10px}
h1,h2{font-family:"General Sans",system-ui,sans-serif;letter-spacing:-.025em;line-height:1.08;margin:0 0 12px}
h1{font-size:clamp(34px,9vw,52px);font-weight:800}
h2{font-size:clamp(26px,6.6vw,36px);font-weight:700}
.lead{color:var(--ink-soft);margin:0 0 22px;font-size:18px}
.help{color:var(--ink-soft);margin:-4px 0 18px;font-size:16px}
.req{color:var(--accent)}
.opt{font-size:14px;font-weight:500;color:var(--ink-soft);font-family:inherit;letter-spacing:0;margin-left:6px;vertical-align:middle}

.privacy{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:14px 16px;margin:0 0 24px;font-size:15px;color:var(--ink-soft)}
.privacy svg{flex:none;margin-top:2px}

/* inputs */
input[type=text],input[type=email],textarea{
  width:100%;font:inherit;font-size:19px;color:var(--ink);background:var(--field);
  border:2px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;transition:border-color .15s, box-shadow .15s}
textarea{min-height:150px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(20,21,28,.08)}
.field.bad input,.field.bad textarea{border-color:var(--error)}
.err{color:var(--error);font-size:15px;font-weight:500;margin:10px 2px 0;min-height:1px}
.count{font-size:13px;color:var(--ink-soft);text-align:right;margin-top:6px}

/* choices */
.choices{display:grid;gap:10px}
.choices.years{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.choice{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-weight:500;font-size:17px;
  color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
  transition:border-color .15s, background .15s, transform .08s}
.choice:hover{border-color:rgba(11,11,15,.28)}
.choice:active{transform:scale(.985)}
.choice:focus-visible{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(20,21,28,.08)}
.choice .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid rgba(11,11,15,.3);display:grid;place-items:center;transition:all .15s}
.choice.multi .mark{border-radius:7px}
.choice[aria-checked=true]{border-color:var(--ink);background:var(--accent-soft)}
.choice[aria-checked=true] .mark{background:var(--ink);border-color:var(--ink)}
.choice[aria-checked=true] .mark::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.choice.multi[aria-checked=true] .mark::after{width:10px;height:6px;border-radius:0;background:none;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.years .choice{justify-content:center;font-family:"General Sans",system-ui,sans-serif;font-weight:700;font-size:19px;padding:16px 10px}
.years .choice .mark{display:none}

/* buttons */
.actions{display:flex;align-items:center;gap:10px;margin-top:26px}
.btn{appearance:none;border:0;font:inherit;font-weight:600;font-size:17px;border-radius:999px;padding:15px 26px;cursor:pointer;
  display:inline-flex;align-items:center;gap:10px;transition:transform .08s, background .15s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.primary{background:var(--ink);color:#fff;margin-left:auto}
.primary:hover{background:#262633}
.primary[disabled]{opacity:.6;cursor:progress}
.ghost{background:transparent;color:var(--ink-soft);padding:15px 14px}
.ghost:hover{color:var(--ink)}
.hint{font-size:13px;color:var(--ink-soft);margin-left:auto;display:none}
@media (hover:hover) and (min-width:600px){.hint{display:block}.primary{margin-left:0}}

.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* welcome + thanks */
.hero-art{display:flex;gap:8px;margin:0 0 22px}
.hero-art span{width:44px;height:44px;border-radius:50%}
.hero-art span:nth-child(1){background:var(--ink)}
.hero-art span:nth-child(2){background:var(--lilac);border-radius:12px}
.hero-art span:nth-child(3){background:#8fb4ff}
.hero-art span:nth-child(4){background:#e3b8e0;border-radius:12px 12px 44px 12px}
.big-tick{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;margin:0 0 20px}
.recap{background:rgba(255,255,255,.55);border-radius:16px;padding:16px 18px;margin:0 0 6px;font-size:15px;color:var(--ink-soft)}
.recap b{color:var(--ink);font-weight:600}

footer{text-align:center;font-size:13px;color:var(--ink-soft);padding:22px 0 4px}
.demo{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--paper);font-size:12px;
  padding:6px 12px;border-radius:999px;opacity:.85}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

35.9 638.3 240.29 633.38 244.02 624.98 244.02 614.28 244.02 606.98 238.67 606.98 229.79 606.98 220.05 613.76 214.61 626.56 214.61L640.88 214.61 640.88 211.26C640.88 204.96 636.39 201.14 628.75 201.14 622.66 201.14 618.36 203.7 616.8 207.74 616.412 208.719 615.463 209.358 614.41 209.35L608.51 209.35C609.66 199.81 617.39 194.17 629.14 194.17 641.55 194.17 648.71 200.38 648.71 211.74L648.71 233C648.71 235.58 649.71 236.25 651.86 236.25ZM640.92 221.19 625.84 221.19C618.84 221.19 614.95 223.77 614.95 229.31 614.95 234.08 619.06 237.31 625.55 237.31 635.29 237.31 640.92 231.68 640.92 223.56Z"/><path d="M524.2 219.09C524.2 233.99 514.27 244.02 500.81 244.02 492.6 244.02 487.06 240.67 484.1 236.02L484.23 243.47 476.23 243.47 476.23 176.6 481.47 176.6C482.9 176.6 484.06 177.76 484.06 179.19L484.06 202.57C487.865 197.14 494.142 193.984 500.77 194.17 514.27 194.17 524.2 203.24 524.2 219.09ZM516.2 219.09C516.2 208.49 509.71 201.09 500.06 201.09 490.41 201.09 484.06 208.44 484.06 218.85 484.06 229.55 490.56 236.99 500.06 236.99 509.56 236.99 516.18 229.69 516.18 219.09Z"/><path d="M528.29 219.09C528.29 204.29 538.22 194.17 552.45 194.17 566.68 194.17 576.61 204.29 576.61 219.09 576.61 233.89 566.68 244 552.45 244 538.22 244 528.29 233.89 528.29 219.09ZM568.59 219.09C568.59 208.69 562.1 201.09 552.45 201.09 542.8 201.09 536.32 208.64 536.32 219.09 536.32 229.54 542.81 237 552.45 237 562.09 237 568.59 229.5 568.59 219.09Z"/><path d="M606.4 194.74 606.4 202.38 602.49 202.38C592.27 202.38 589.49 210.88 589.49 218.62L589.49 243.44 581.66 243.44 581.66 194.74 586.9 194.74C588.33 194.74 589.49 195.9 589.49 197.33L589.49 202.1C591.78 198.37 595.49 194.74 604.2 194.74Z"/><path d="M687.88 219.09C687.88 204.29 697.24 194.17 710.99 194.17 724.74 194.17 733.71 202.86 734.1 217.28 734.1 218.33 734 219.48 733.9 220.62L696.09 220.62 696.09 221.29C696.38 230.55 702.2 237.04 711.47 237.04 717.7 237.04 722.67 234.04 724.76 228.81 725.143 227.797 726.107 227.122 727.19 227.11L733.19 227.11C731.33 236.85 723.31 244 712 244 697.43 244 687.88 234 687.88 219.09ZM725.69 214.09C724.93 205.69 719.2 201.01 711.08 201.01 703.575 200.926 697.262 206.617 696.57 214.09Z"/><path d="M672 193.45 672 181.09 664.17 181.09 664.17 192.16C664.17 193.59 663.01 194.75 661.58 194.75L652.72 194.75 652.72 201.9C656.16 201.9 659.08 202.01 662.26 202.01Z"/><path d="M677.62 236.28C673.42 236.28 671.99 234.75 671.99 230.65L671.99 204.5C671.99 203.07 673.15 201.91 674.58 201.91L684.58 201.91 684.58 194.74 674.17 194.74 664.17 203.74 664.17 230.74C664.17 239.34 667.51 243.44 676.87 243.44L685.37 243.44 685.37 236.28Z"/><path d="M154.52 279.26 136 260.74 180.69 216.05C184.51 212.23 184.51 208.11 180.69 204.29L136 159.6 154.52 141.08 188.92 175.48C190.68 177.24 190.98 178.42 190.98 181.06L190.98 239.28C190.98 241.63 190.68 243.1 188.92 244.86ZM237.86 140.79 256.38 159.31 211.69 204C207.87 207.82 207.87 211.93 211.69 215.76L256.38 260.44 237.86 279 203.46 244.61C201.7 242.84 201.4 241.67 201.4 239.02L201.4 180.77C201.4 178.42 201.7 176.95 203.46 175.18Z"/></g></svg></a>

  <div class="progress" id="progress" aria-hidden="true"><i id="bar"></i></div>

  <footer>Your answers go straight to Collaborate's secure form provider. Nothing is saved on this page.</footer>

<script>
/* =========================================================
   JOTFORM CONFIG
   ---------------------------------------------------------
   1. Build the Jotform form(s) with the fields listed below.
   2. Paste each Form ID (the number in the form's URL).
   3. Paste each field's submission name, e.g. "q4_name".
      Find these in Jotform: Publish > Embed > Source Code,
      then look for name="q.._...." on each input.
      Checkbox fields end in [] e.g. "q7_roles[]".
   You can use two forms (recommended, so each can be deleted
   on its own schedule) or the same Form ID for both.
   Leave formId empty to run in demo mode (nothing is sent).
   EU data centre forms: use https://eu-submit.jotform.com/submit/
   ========================================================= */
const JOTFORM = {
  submitBase: "https://eu-submit.jotform.com/submit/",   // Collaborate's Jotform account is on EU servers
  placement: {           // Section A: Year 10 work placements  (Jotform: "Careers Fair: Work Placements")
    formId: "263132894822360",
    fields: {
      year:     "q2_year",
      name:     "q3_name",
      email:    "q4_email",
      interest: "q5_interest",
      roles:    "q6_roles[]",
      about:    "q7_about"
    }
  },
  brief: {               // Section B: Pitch it  (Jotform: "Careers Fair: Pitch It")
    formId: "263133636714355",
    fields: {
      year:     "q2_year",
      name:     "q3_name",
      company:  "q4_company",
      idea:     "q5_idea",
      audience: "q6_audience",
      outcome:  "q7_outcome",
      why:      "q8_why",
      title:    "q9_title"
    }
  }
};

/* ---------------- Question flow ---------------- */
const YEARS = ["Year 7","Year 8","Year 9","Year 10","Year 11","Year 12","Year 13"];

const FLOWS = {
  placement: [
    { type:"intro", eyebrow:"Year 10", title:"Work placements at Collaborate",
      body:"We'd love to hear from you if you're interested in a work placement with us.",
      privacy:"We'll only use your name and email to contact you about work placements at Collaborate. We won't share your details with anyone else, and we'll delete them once placements for this year have been arranged." },
    { id:"name",  type:"text",  label:"What's your name?", required:true, autocomplete:"name", placeholder:"First and last name" },
    { id:"email", type:"email", label:"What's your email address?", required:true, autocomplete:"email", placeholder:"you@example.com" },
    { id:"interest", type:"single", label:"Would you be interested in a work placement at Collaborate?", required:true,
      options:["Yes, definitely","Maybe, I'd like to find out more","No, not right now"] },
    { id:"roles", type:"multi", label:"What type of role would you be interested in?", help:"Tick all that apply.",
      options:["People initiatives","Videography & editing","Project management","Events","Marketing","Not sure yet"] },
    { id:"about", type:"long", label:"Tell us a little bit about you.",
      help:"What are you into, what are you good at, and what would you like to get out of a placement?", placeholder:"Write as much or as little as you like" }
  ],
  brief: [
    { type:"intro", eyebrow:"Pitch it", title:"Your idea, their brand",
      body:"At Collaborate, we come up with big ideas and pitch them to brands. Now it's your turn: pick a company you love and tell us the idea you think we should pitch to them.",
      privacy:"We'll only use your name to recognise your idea, for example if we share our favourites with your school. We won't share it anywhere else, and we'll delete it after the careers fair." },
    { id:"name", type:"text", label:"What's your name?", required:true, autocomplete:"name", placeholder:"First and last name" },
    { id:"company", type:"text", label:"Which company is your idea for?", required:true,
      help:"Any brand, business or cause you love. Big or small.", placeholder:"e.g. Nike, your local football club, a charity" },
    { id:"idea", type:"long", label:"What idea should we pitch them?", required:true,
      help:"An event, a video, a campaign, a launch, something nobody's tried before. Tell us what it is and how it works.", placeholder:"e.g. a pop-up skate park in town where every ramp is made from old trainers" },
    { id:"audience", type:"text", label:"Who's it for?", required:true,
      help:"Who's the audience the company wants to reach?", placeholder:"e.g. teenagers who've never skated before" },
    { id:"outcome", type:"text", label:"What should people think, feel or do afterwards?", required:true,
      placeholder:"e.g. feel like they belong, then sign up for a lesson" },
    { id:"why", type:"text", label:"Why would the company say yes?",
      help:"What makes your idea perfect for them?", placeholder:"Optional, but this is how you win a pitch" },
    { id:"title", type:"text", label:"Give your idea a name.",
      help:"Every great pitch has one.", placeholder:"Optional, e.g. Sole Ramps" }
  ]
};

/* ---------------- State ---------------- */
const state = { year:null, flow:null, i:0, answers:{} };
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const progress = document.getElementById("progress");
const demoMode = () => !JOTFORM[state.flow]?.formId;

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arrow = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const lock = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function swap(html, after){
  const old = app.firstElementChild;
  const put = () => {
    app.innerHTML = html;
    window.scrollTo({top:0, behavior:"smooth"});
    after && after();
  };
  if (old && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    old.classList.add("out");
    setTimeout(put, 180);
  } else put();
}

function setProgress(){
  if (!state.flow){ progress.classList.remove("on"); bar.style.width = "0"; return; }
  const total = FLOWS[state.flow].length + 1;          // + year question
  const done = state.i + 1;
  progress.classList.add("on");
  bar.style.width = Math.min(100, (done / total) * 100) + "%";
}

/* ---------------- Screens ---------------- */
/* Phone back button / swipe back moves to the previous question */
let screen = "welcome";
function forward(){ try{ history.pushState({s:Date.now()}, ""); }catch(e){} }
function goBack(){ try{ history.back(); }catch(e){ internalBack(); } }
function internalBack(){
  if (screen === "year") return welcome();
  if (screen === "flow"){ if (state.i === 0) return askYear(); state.i--; return step(); }
  if (screen === "thanks") return welcome();
}
window.addEventListener("popstate", internalBack);

function welcome(){
  screen = "welcome"; state.flow = null; setProgress();
  swap(`
    <section class="card">
      <div class="hero-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="eyebrow">Thanks for visiting our stand</p>
      <h1>Hello! Got two minutes?</h1>
      <p class="lead">Tell us which year you're in and we'll take you to the right place. Year 10s can register for a work placement, and everyone else gets to pitch us an idea for a brand they love.</p>
      <div class="actions"><button class="btn primary" id="go">Let's go ${arrow}</button></div>
    </section>`, () => document.getElementById("go").onclick = () => { forward(); askYear(); });
}

function askYear(){
  screen = "year"; state.flow = null; progress.classList.add("on"); bar.style.width = "8%";
  swap(`
    <section class="card">
      <p class="eyebrow">Question 1</p>
      <h2 id="q">What year are you in? <span class="req" aria-hidden="true">*</span></h2>
      <div class="choices years" role="radiogroup" aria-labelledby="q">
        ${YEARS.map(y => `<button type="button" class="choice" role="radio" aria-checked="${state.year===y}" data-v="${y}"><span class="mark"></span>${y}</button>`).join("")}
      </div>
      <p class="err" id="err"></p>
      <div class="actions">
        <button class="btn ghost" id="back">Back</button>
        <button class="btn primary" id="next">Next ${arrow}</button>
      </div>
    </section>`, () => {
      app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
        state.year = b.dataset.v;
        app.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-checked", x === b));
        setTimeout(chooseFlow, 220);
      });
      document.getElementById("back").onclick = goBack;
      document.getElementById("next").onclick = () => state.year ? chooseFlow() : (document.getElementById("err").textContent = "Pick your year to carry on.");
    });
}

function chooseFlow(){
  forward();
  const flow = state.year === "Year 10" ? "placement" : "brief";
  if (state.flow !== flow) state.answers = {};
  state.flow = flow; state.i = 0;
  step();
}

function step(){
  screen = "flow"; setProgress();
  const flow = FLOWS[state.flow];
  const q = flow[state.i];
  const last = state.i === flow.length - 1;
  const qNum = state.i + 1;   // intro is index 0, so first question is "Question 2"

  if (q.type === "intro"){
    return swap(`
      <section class="card">
        <p class="eyebrow">${esc(q.eyebrow)}</p>
        <h2>${esc(q.title)}</h2>
        <p class="lead">${esc(q.body)}</p>
        <div class="privacy">${lock}<span>${esc(q.privacy)}</span></div>
        <div class="actions">
          <button class="btn ghost" id="back">Back</button>
          <button class="btn primary" id="next">Start ${arrow}</button>
        </div>
      </section>`, () => {
        document.getElementById("back").onclick = goBack;
        document.getElementById("next").onclick = () => { forward(); state.i++; step(); };
      });
  }

  const v = state.answers[q.id];
  let control = "";
  if (q.type === "text" || q.type === "email"){
    control = `<div class="field"><input id="in" type="${q.type}" ${q.type==="email"?'inputmode="email" autocapitalize="off" spellcheck="false"':''}
      autocomplete="${q.autocomplete||"off"}" enterkeyhint="${last?"send":"next"}" ${q.autocomplete==="name"?'autocapitalize="words"':''} placeholder="${esc(q.placeholder||"")}" value="${esc(v||"")}" maxlength="300"
      aria-labelledby="q" ${q.help?'aria-describedby="h"':''} ${q.required?'aria-required="true"':''}></div>`;
  } else if (q.type === "long"){
    control = `<div class="field"><textarea id="in" enterkeyhint="enter" placeholder="${esc(q.placeholder||"")}" maxlength="2000" aria-labelledby="q" ${q.help?'aria-describedby="h"':''}>${esc(v||"")}</textarea>
      <div class="count"><span id="cnt">${(v||"").length}</span> / 2000</div></div>`;
  } else {
    const multi = q.type === "multi";
    const sel = multi ? (v||[]) : v;
    control = `<div class="choices" role="${multi?"group":"radiogroup"}" aria-labelledby="q">
      ${q.options.map(o => {
        const on = multi ? sel.includes(o) : sel === o;
        return `<button type="button" class="choice ${multi?"multi":""}" role="${multi?"checkbox":"radio"}" aria-checked="${on}" data-v="${esc(o)}"><span class="mark"></span>${esc(o)}</button>`;
      }).join("")}
    </div>`;
  }

  swap(`
    <section class="card">
      <p class="eyebrow">Question ${qNum} of ${flow.length}</p>
      <h2 id="q">${esc(q.label)}${q.required?' <span class="req" aria-hidden="true">*</span>':'<span class="opt">Optional</span>'}</h2>
      ${q.help?`<p class="help" id="h">${esc(q.help)}</p>`:""}
      ${control}
      <p class="err" id="err" role="alert"></p>
      <div class="actions">
        <button class="btn ghost" id="back">Back</button>
        <span class="hint">${q.type==="long"?"Ctrl + Enter":"Press Enter"}</span>
        <button class="btn primary" id="next">${last?"Send":"Next"} ${arrow}</button>
      </div>
    </section>`, () => {
      const input = document.getElementById("in");
      if (input){
        if (matchMedia("(hover:hover)").matches) input.focus();
        input.addEventListener("focus", () => setTimeout(() => input.scrollIntoView({block:"center", behavior:"smooth"}), 300));
        input.addEventListener("input", () => {
          state.answers[q.id] = input.value;
          input.parentElement.classList.remove("bad");
          document.getElementById("err").textContent = "";
          const c = document.getElementById("cnt"); if (c) c.textContent = input.value.length;
        });
        input.addEventListener("keydown", e => {
          if (e.key === "Enter" && (q.type !== "long" || e.ctrlKey || e.metaKey)){ e.preventDefault(); next(q, last); }
        });
      }
      app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
        const val = b.dataset.v;
        if (q.type === "multi"){
          let arr = state.answers[q.id] || [];
          arr = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
          state.answers[q.id] = arr;
          b.setAttribute("aria-checked", arr.includes(val));
        } else {
          state.answers[q.id] = val;
          app.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-checked", x === b));
          setTimeout(() => next(q, last), 220);
        }
        document.getElementById("err").textContent = "";
      });
      document.getElementById("back").onclick = goBack;
      document.getElementById("next").onclick = () => next(q, last);
    });
}

function validate(q){
  let v = state.answers[q.id];
  if (typeof v === "string") v = state.answers[q.id] = v.trim();
  if (q.required && (!v || (Array.isArray(v) && !v.length)))
    return q.type === "single" ? "Pick one option to carry on." : "This one's needed before you carry on.";
  if (q.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))
    return "That email doesn't look quite right. Check for typos?";
  return "";
}

function next(q, last){
  const msg = validate(q);
  if (msg){
    document.getElementById("err").textContent = msg;
    const f = app.querySelector(".field"); if (f) f.classList.add("bad");
    return;
  }
  if (last) return send();
  forward(); state.i++; step();
}

/* ---------------- Submit to Jotform ---------------- */
function send(){
  const btn = document.getElementById("next");
  btn.disabled = true; btn.innerHTML = `Sending <span class="spinner"></span>`;
  const cfg = JOTFORM[state.flow];
  const data = { year: state.year, ...state.answers };

  if (demoMode()){
    console.info("[Demo mode] Would send to Jotform:", JSON.stringify(data));
    return setTimeout(thanks, 700);
  }

  const body = new URLSearchParams();
  body.append("formID", cfg.formId);
  body.append("simple_spc", cfg.formId + "-" + cfg.formId);
  for (const [key, name] of Object.entries(cfg.fields)){
    const val = data[key];
    if (val == null || val === "") continue;
    Array.isArray(val) ? val.forEach(x => body.append(name, x)) : body.append(name, val);
  }
  fetch(JOTFORM.submitBase + encodeURIComponent(cfg.formId), { method:"POST", mode:"no-cors", body, keepalive:true })
    .then(thanks)
    .catch(() => {
      btn.disabled = false; btn.innerHTML = `Try again ${arrow}`;
      document.getElementById("err").textContent = "We couldn't send that. Check you've got signal or Wi-Fi, then try again.";
    });
}

function thanks(){
  screen = "thanks";
  progress.classList.add("on"); bar.style.width = "100%";
  const a = state.answers, placement = state.flow === "placement";
  const first = (a.name || "").split(" ")[0];
  swap(`
    <section class="card">
      <div class="big-tick" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#14151c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <p class="eyebrow">All sent</p>
      <h2>Thanks${first ? ", " + esc(first) : ""}!</h2>
      <p class="lead">${placement
        ? (a.interest === "No, not right now"
            ? "Thanks for letting us know. If you change your mind, you know where to find us."
            : "We've got your details and we'll be in touch by email about work placements at Collaborate.")
        : "Your pitch is with the Collaborate team. Keep an eye out, we might share our favourites with your school."}</p>
      ${!placement ? `<div class="recap"><b>Your pitch${a.title ? ": " + esc(a.title) : ""}</b><br>An idea for ${esc(a.company)}, made for ${esc(a.audience)}.</div>` : ""}
      ${demoMode() ? `<p class="help" style="margin-top:14px">Demo mode: nothing was sent. Add your Jotform Form ID to go live.</p>` : ""}
      <div class="actions"><button class="btn ghost" id="again">Start again</button></div>
    </section>`, () => document.getElementById("again").onclick = () => { state.year = null; state.answers = {}; welcome(); });
  state.flow = null;
  state.answers = {}; state.year = null;   // nothing left in memory once it's sent
}

welcome();
if (!JOTFORM.placement.formId && !JOTFORM.brief.formId){
  const d = document.createElement("div"); d.className = "demo"; d.textContent = "Demo mode: no Jotform connected yet";
  document.body.appendChild(d);
}
</script>
</body>
</html>
